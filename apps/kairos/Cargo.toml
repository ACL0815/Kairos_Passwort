[package]
name = "kairos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Kairos Passwort Windows application"

[features]
# Fake data is available only in debug builds, never in a release binary.
demo = ["eframe/__screenshot", "dep:image"]

[dependencies]
kairos-core.workspace = true
kairos-wordlists.workspace = true
kairos-platform.workspace = true
kairos-keepassxc.workspace = true
kairos-bridge.workspace = true
kairos-hardening.workspace = true
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"
tray-icon = { version = "0.24", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

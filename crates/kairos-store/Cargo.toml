[package]
name = "kairos-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Encrypted external word lists backed by SQLCipher"
rust-version = "1.89"

[dependencies]
kairos-core.workspace = true
hex = "0.4.3"
hmac = "0.12.1"
rand = { version = "=0.9.5", default-features = false, features = ["os_rng", "std", "std_rng", "unbiased"] }
rusqlite = { version = "0.41.0", default-features = false, features = ["libsqlite3-sys", "bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.10.9"
thiserror = "2.0"
tempfile = "3.23"
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

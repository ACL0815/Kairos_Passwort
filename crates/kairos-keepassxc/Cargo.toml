[package]
name = "kairos-keepassxc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "KeePassXC browser protocol client"
rust-version = "1.89"

[dependencies]
base64 = "0.22.1"
crypto_box = { version = "0.9.1", default-features = false, features = ["alloc", "salsa20"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["zeroize"] }
getrandom = "0.2.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
salsa20 = { version = "0.10.2", features = ["zeroize"] }
fluent-uri = "0.4.1"
zeroize = { workspace = true, features = ["serde"] }

[target.'cfg(windows)'.dependencies]
tempfile = "3.23"
tokio = { version = "1.54", features = ["net", "rt", "time", "io-util"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3.23"

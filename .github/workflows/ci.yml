name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - name: Check native Perl for vendored OpenSSL
        shell: pwsh
        run: |
          $perlBin = 'C:\Strawberry\perl\bin'
          if (-not (Test-Path "$perlBin\perl.exe")) { throw 'Strawberry Perl is required for SQLCipher/OpenSSL' }
          $perlBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$perlBin\perl.exe" -MLocale::Maketext::Simple -e 'print "$^V Locale::Maketext::Simple OK\n"'
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace

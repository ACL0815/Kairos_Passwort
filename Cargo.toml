[workspace]
members = [
    "crates/kairos-core",
    "crates/kairos-wordlists",
    "crates/kairos-store",
    "crates/kairos-hardening",
    "crates/kairos-platform",
    "crates/kairos-keepassxc",
    "apps/kairos",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kairos-core = { path = "crates/kairos-core" }
kairos-wordlists = { path = "crates/kairos-wordlists" }
kairos-store = { path = "crates/kairos-store" }
kairos-hardening = { path = "crates/kairos-hardening" }
kairos-platform = { path = "crates/kairos-platform" }
kairos-keepassxc = { path = "crates/kairos-keepassxc" }
# Keep the scaffold buildable with the installed stable Rust 1.80 toolchain.
zeroize = "=1.8.2"

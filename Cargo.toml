[workspace]
members = [
    "crates/kairos-core",
    "crates/kairos-wordlists",
    "crates/kairos-store",
    "crates/kairos-platform",
    "crates/kairos-keepassxc",
    "crates/kairos-bridge",
    "apps/kairos",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kairos-core = { path = "crates/kairos-core" }
kairos-wordlists = { path = "crates/kairos-wordlists" }
kairos-store = { path = "crates/kairos-store" }
kairos-platform = { path = "crates/kairos-platform" }
kairos-keepassxc = { path = "crates/kairos-keepassxc" }
kairos-bridge = { path = "crates/kairos-bridge" }
# Workspace MSRV: Rust 1.95 (verified dependency requirement).
zeroize = "=1.8.2"
